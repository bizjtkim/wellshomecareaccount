const layoutEl=document.querySelector('.layout'),splitter=document.getElementById('splitter');splitter.addEventListener('pointerdown',e=>{const leftCol=document.querySelector('.leftcol'),startX=e.clientX,startLeft=leftCol.getBoundingClientRect().width,total=layoutEl.clientWidth-24;splitter.classList.add('dragging');splitter.setPointerCapture(e.pointerId);splitter.onpointermove=m=>{const left=Math.max(360,Math.min(total-380,startLeft+m.clientX-startX));const right=total-left;layoutEl.style.gridTemplateColumns=`${left}px 8px ${right}px`;map?.invalidateSize({pan:false})};splitter.onpointerup=()=>{splitter.onpointermove=null;splitter.classList.remove('dragging');map?.invalidateSize({pan:false})}});
const editResizeHandle=document.getElementById('editResizeHandle'),rightPanel=document.querySelector('.right'),editPanel=document.querySelector('.editPanel');
function setEditPanelHeight(height){const max=Math.max(220,Math.min(window.innerHeight*.56,700)),value=Math.round(Math.max(180,Math.min(max,height)));rightPanel.style.setProperty('--edit-panel-height',value+'px');editResizeHandle.setAttribute('aria-valuenow',String(value))}
editResizeHandle.addEventListener('pointerdown',e=>{e.preventDefault();const startY=e.clientY,startHeight=editPanel.getBoundingClientRect().height;editResizeHandle.setPointerCapture(e.pointerId);editResizeHandle.classList.add('dragging');editResizeHandle.onpointermove=m=>setEditPanelHeight(startHeight+startY-m.clientY);editResizeHandle.onpointerup=()=>{editResizeHandle.onpointermove=null;editResizeHandle.classList.remove('dragging')}});
editResizeHandle.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();const current=editPanel.getBoundingClientRect().height;setEditPanelHeight(current+(e.key==='ArrowUp'?20:-20))}});

document.getElementById('staffSort').onchange=e=>{staffSortKey=e.target.value;render()};document.getElementById('mapInfoMode').onchange=e=>{mapInfoMode=e.target.value;refreshLabels();if(selectedRegion)openRegionPopup(selectedRegion)};document.getElementById('kPeople').onclick=showPeople;document.getElementById('allView').onclick=fitAll;document.getElementById('closeModal').onclick=()=>document.getElementById('modal').close();document.getElementById('editTargets').onchange=render;
document.getElementById('toggleRegionEdit').onclick=()=>{regionEditMode=!regionEditMode;if(!regionEditMode){selectedRegions.clear();selectedRegion=''}else if(document.getElementById('modal').open)document.getElementById('modal').close();render()};document.getElementById('clearRegions').onclick=()=>{selectedRegions.clear();selectedRegion='';render()};document.getElementById('applyRegionChange').onclick=()=>{const target=document.getElementById('editTargets').value,owners=target?[target]:[],rows=state.regions.filter(r=>selectedRegions.has(r.region));if(!rows.length||!target)return;const label=target;if(!confirm(`선택한 ${rows.length}개 지역의 담당자를 ${label}(으)로 변경할까요?`))return;rows.forEach(r=>{r.staffs=[...owners];r.staff=target});selectedRegions.clear();regionEditMode=false;selectedRegion='';save();msg(`${rows.length}개 지역의 담당자를 변경했습니다.`)};
function csv(rows){const s='행번호,고객번호,이름,지역기준,우편번호,주소,사유\r\n'+rows.map(x=>[x.row,x.customer_id,x.name,x.region_flag,x.postal,x.address,x.reason].map(v=>'"'+String(v||'').replaceAll('"','""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+s],{type:'text/csv;charset=utf-8'}));a.download='주소확인_오류보고.csv';a.click();URL.revokeObjectURL(a.href)}function downloadStaffAnalysis(){const t=getTotals(),names=[...eligiblePeople()];names.sort((a,b)=>staffSortKey==='name'?a.localeCompare(b,'ko'):staffSortKey==='distance'?((distanceForStaff(b)??-1)-(distanceForStaff(a)??-1))||a.localeCompare(b,'ko'):(Number(t[b]?.[staffSortKey]||0)-Number(t[a]?.[staffSortKey]||0))||a.localeCompare(b,'ko'));const rows=[['구분','담당자','지역','담당 지역 수','계정수','최대 거리(km)']];for(const n of names){const owned=state.regions.filter(r=>peopleOf(r).includes(n)).sort((a,b)=>a.region.localeCompare(b.region,'ko'));rows.push(['담당자',n,'',t[n]?.regions||0,t[n]?.accounts||0,distanceForStaff(n)??'']);for(const r of owned)rows.push(['지역별',n,r.region,1,r.accounts,distanceForStaff(n)??''])}const un=state.regions.filter(r=>!peopleOf(r).length).sort((a,b)=>a.region.localeCompare(b.region,'ko'));rows.push(['담당자','미지정','',t['미지정'].regions,t['미지정'].accounts,'']);for(const r of un)rows.push(['지역별','미지정',r.region,1,r.accounts,'']);const text=rows.map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+text],{type:'text/csv;charset=utf-8'}));a.download='담당자별_지역_계정현황.csv';const url=a.href;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}document.getElementById('downloadStaffAnalysis').onclick=downloadStaffAnalysis;
document.getElementById('reportCsv').onclick=()=>csv([...BASE.unmatched,...BASE.errors,...BASE.duplicates]);document.getElementById('conflictCsv').onclick=()=>csv(BASE.conflicts.map(x=>({row:'',customer_id:'',name:Object.keys(x.staff).map(k=>k+':'+x.staff[k]).join(' | '),region_flag:'공동 담당',postal:'',address:x.region,reason:'공동 담당: '+x.selected})));
